# Tailscale ingress — see README.md "Adding a service" for how this works
# (MagicDNS, TLS, tailnet lock signing). Reachable at:
#   https://radarr.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: radarr
      port:
        number: 7878
  tls:
    - hosts:
        - radarr
