# Tailscale ingress — see README.md "Adding a service" for how this works
# (MagicDNS, TLS, tailnet lock signing). Reachable at:
#   https://jellyfin.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jellyfin
      port:
        number: 8096
  tls:
    - hosts:
        - jellyfin
