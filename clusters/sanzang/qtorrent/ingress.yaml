# Tailscale ingress — see README.md "Adding a service" for how this works
# (MagicDNS, TLS, tailnet lock signing). Reachable at:
#   https://qbittorrent.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: qbittorrent
      port:
        number: 8080
  tls:
    - hosts:
        - qbittorrent
