# Tailscale ingress — see README.md "Adding a service" for how this works
# (MagicDNS, TLS, tailnet lock signing). Reachable at:
#   https://jackett.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett
  namespace: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jackett
      port:
        number: 9117
  tls:
    - hosts:
        - jackett
